name: PeiPei
options:
  bundleIdPrefix: com.peipei
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: MNB3V4MHFJ
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "3.0.27"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
schemes:
  PeiPei:
    build:
      targets:
        PeiPei: all
        PeiPeiUITests: [test]
    test:
      targets:
        - PeiPeiUITests
    run:
      config: Debug
      storeKitConfiguration: PeiPei/PeiPeiProducts.storekit
targets:
  PeiPei:
    type: application
    platform: iOS
    sources:
      - PeiPei
    dependencies:
      - package: GoogleSignIn
    settings:
      base:
        INFOPLIST_FILE: PeiPei/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.peipei.app
        CODE_SIGN_STYLE: Automatic
        GOOGLE_CLIENT_ID: 994446502706-r757oc83gmnvao3b6us9fkihdtf3b3qk.apps.googleusercontent.com
        GOOGLE_URL_SCHEME: com.googleusercontent.apps.994446502706-r757oc83gmnvao3b6us9fkihdtf3b3qk
    info:
      path: PeiPei/Info.plist
      properties:
        CFBundleName: PeiPei
        CFBundleDisplayName: PeiPei
        CFBundleShortVersionString: "3.0.27"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        GIDClientID: 994446502706-r757oc83gmnvao3b6us9fkihdtf3b3qk.apps.googleusercontent.com
        GIDServerClientID: 994446502706-4tnjlivm1e9g0a8ecv148fh9sm0bnd7o.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.994446502706-r757oc83gmnvao3b6us9fkihdtf3b3qk
        NSMicrophoneUsageDescription: "PeiPei needs microphone access to record voice messages for your coach."
        NSCameraUsageDescription: "PeiPei needs camera access to capture photos to share with your coach."
        NSPhotoLibraryUsageDescription: "PeiPei needs photo library access to attach images to your messages."
  PeiPeiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PeiPeiUITests
    dependencies:
      - target: PeiPei
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peipei.app.uitests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
