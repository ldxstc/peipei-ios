name: PeiPei
options:
  bundleIdPrefix: com.peipei
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: MNB3V4MHFJ
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "3.0.4"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  PeiPei:
    build:
      targets:
        PeiPei: all
        PeiPeiUITests: [test]
    test:
      targets:
        - PeiPeiUITests
    run:
      config: Debug
targets:
  PeiPei:
    type: application
    platform: iOS
    sources:
      - PeiPei
    settings:
      base:
        INFOPLIST_FILE: PeiPei/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.peipei.app
        CODE_SIGN_STYLE: Automatic
    info:
      path: PeiPei/Info.plist
      properties:
        CFBundleName: PeiPei
        CFBundleDisplayName: PeiPei
        CFBundleShortVersionString: "3.0.4"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "PeiPei needs microphone access to record voice messages for your coach."
        NSCameraUsageDescription: "PeiPei needs camera access to capture photos to share with your coach."
        NSPhotoLibraryUsageDescription: "PeiPei needs photo library access to attach images to your messages."
  PeiPeiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PeiPeiUITests
    dependencies:
      - target: PeiPei
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peipei.app.uitests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
